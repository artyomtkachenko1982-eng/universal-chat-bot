                            <div className="flex items-center gap-2 bg-red-50 border border-red-300 rounded-lg px-3 py-2 fade-in">
                              <span className="text-red-700 text-xs font-medium">❌ Ошибка при сохранении. Попробуй ещё раз.</span>
                            </div>
                          )}
                          {Object.keys(priceEdits).length > 0 && priceSaveStatus !== "saved" && (
                            <div className="flex items-center gap-2 bg-yellow-50 border border-yellow-300 rounded-lg px-3 py-2 fade-in">
                              <span className="text-yellow-700 text-xs">⚡ Есть несохранённые изменения</span>
                            </div>
                          )}
                          <button onClick={savePrices}
                            disabled={Object.keys(priceEdits).length === 0 || priceSaveStatus === "saving"}
                            className="w-full bg-yellow-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-yellow-700 disabled:opacity-50 transition-colors">
                            {priceSaveStatus === "saving" ? "⏳ Сохранение..." : "💾 Сохранить цены в БД"}
                          </button>
                        </div>
                      );
                    })()}

                    {/* 🔐 Админ: список заявок — цветные карточки */}
                    {isAdmin && step === "admin_panel" && adminSection !== "prices" && adminSection !== "messages" && adminSection !== "stats" && !adminSelected && (
                      <div className="space-y-2 fade-in">
                        {/* Фильтр по типу (только в разделе Реклама) */}
                        {adminSection === "ads" && (
                          <div className="flex gap-1 flex-wrap">
                            <button onClick={() => openPriceEditor()}
                              className="px-3 py-1.5 rounded-lg text-xs font-medium bg-yellow-50 border border-yellow-200 text-yellow-700 hover:bg-yellow-100">💰 Цены</button>
                            {[
                              { key: "all", label: "Все" },
                              { key: "feed", label: "📢 Объявления" },
                              { key: "banner", label: "🎯 Баннеры" },
                              { key: "article", label: "📰 Статьи" },
                            ].map(f => (
                              <button key={f.key} onClick={() => { setAdFilterType(f.key); setAdminListPage(1); }}
                                className={`px-2 py-1 rounded text-xs font-medium transition-colors ${
                                  adFilterType === f.key
                                    ? "bg-blue-600 text-white"
                                    : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                                }`}>
                                {f.label}
                              </button>
                            ))}
                          </div>
                        )}

                        {/* Фильтр по типу (только в разделе Архив) */}
                        {adminSection === "archive" && (
                          <div className="flex gap-1">
                            {[
                              { key: "all", label: "Все" },
                              { key: "ad", label: "📢 Реклама" },
                              { key: "news", label: "📰 Новости" },
                              { key: "message", label: "💬 Сообщения" },
                              { key: "chat", label: "🗂️💬 Чаты" },
                            ].map(f => (
                              <button key={f.key} onClick={() => { 
                                setArchiveFilterType(f.key); 
                                setAdminListPage(1);
                                if (f.key === "chat") loadAdminSection("archive", true, "chat");
                              }}
                                className={`px-2 py-1 rounded text-xs font-medium transition-colors ${
                                  archiveFilterType === f.key
                                    ? "bg-blue-600 text-white"
                                    : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                                }`}>
                                {f.label}
                              </button>
                            ))}
                          </div>
                        )}

                        {/* Список заявок — цветные карточки */}
                        {(() => {
                          const filtered = adminItems.filter(item => {
                            if (adminSection === "ads") return adFilterType === "all" || item.ad_type === adFilterType;
                            if (adminSection === "archive") return archiveFilterType === "all" || item.type === archiveFilterType;
                            return true;
                          });
                          if (filtered.length === 0 && adminSection !== "archive") {
                            return <div className="text-center text-gray-400 text-xs py-6">📭 Нет элементов в этом разделе</div>;
                          }
                          const perPage = 5;
                          const totalLocalPages = Math.max(1, Math.ceil(filtered.length / perPage));
                          const curPage = Math.min(adminListPage, totalLocalPages);
                          const pageItems = filtered.slice((curPage-1)*perPage, curPage*perPage);
                          return (<>
                            <div className="space-y-2">
                              {pageItems.map(item => {
                                const isAd = item.type === "ad";
                                let bgGrad, borderColor, headerGrad;
                                if (isAd && item.ad_type === "banner") {
                                  bgGrad = "linear-gradient(135deg,#faf5ff,#f3e8ff)"; borderColor = "#d8b4fe"; headerGrad = "linear-gradient(135deg,#9333ea,#7c3aed)";
                                } else if (isAd && item.ad_type === "article") {
                                  bgGrad = "linear-gradient(135deg,#ecfdf5,#d1fae5)"; borderColor = "#6ee7b7"; headerGrad = "linear-gradient(135deg,#059669,#047857)";
                                } else if (isAd) {
                                  bgGrad = "linear-gradient(135deg,#fef9f0,#fff7ed)"; borderColor = "#fde68a"; headerGrad = "linear-gradient(135deg,#f97316,#ea580c)";
                                } else if (item.type === "news") {
                                  bgGrad = "linear-gradient(135deg,#f0f4ff,#e0e7ff)"; borderColor = "#93c5fd"; headerGrad = "linear-gradient(135deg,#2563eb,#1d4ed8)";
                                } else {
                                  bgGrad = "linear-gradient(135deg,#fefce8,#fef9c3)"; borderColor = "#fde68a"; headerGrad = "linear-gradient(135deg,#ca8a04,#a16207)";
                                }
                                const typeLabel = isAd
                                  ? (item.ad_type === "banner" ? "🎯 Баннер" : item.ad_type === "article" ? "📰 Статья" : "📢 Объявление")
                                  : (item.type === "news" ? "📰 Новость" : "💬 Сообщение");
                                const statusMap = { "Новая": ["🆕","Новая"], "На рассмотрении": ["⏳","В работе"], "Выполнена": ["✅","Выполнена"], "Отклонена": ["❌","Отклонена"], "answered": ["✅","Отвечено"], "Новое": ["🆕","Новое"] };
                                const [statusEmoji, statusLabel] = statusMap[item.status] || ["⚪", item.status || ""];
                                const price = item.corrected_price || item.total_price || 0;
                                return (
                                  <div key={`${item.type}-${item.id}`}
                                    onClick={() => viewAdminItem(item)}
                                    className="rounded-xl overflow-hidden shadow-sm border cursor-pointer hover:shadow-md transition-shadow"
                                    style={{background: bgGrad, borderColor}}
                                  >
                                    <div className="px-3 py-1.5" style={{background: headerGrad}}>
                                      <div className="flex items-center justify-between">
                                        <span className="text-white text-xs font-bold">{typeLabel} #{item.id}</span>
                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-medium" style={{background:"rgba(255,255,255,0.2)",color:"white"}}>{statusEmoji} {statusLabel}</span>
                                      </div>
                                    </div>
                                    <div className="p-2.5 text-xs">
                                      <div className="flex items-center gap-2 text-gray-500 mb-1">
                                        <span>👤 <strong className="text-gray-700">{item.user_name}</strong></span>
                                        {item.platform && <span className="text-gray-400">· {item.platform}</span>}
                                        <span className="ml-auto text-[10px]">{item.time_ago || item.answered_time_ago || ""}</span>
                                      </div>
                                      <div className="text-gray-600 truncate">«{item.preview || item.title || ""}»</div>
                                      {isAd && (
                                        <div className="flex items-center justify-between mt-1.5 pt-1.5 border-t border-gray-200/50">
                                          <span>{item.image_path ? "🖼️" : ""}</span>
                                          <span className="font-bold text-[13px]" style={{color: headerGrad.includes("9333ea") ? "#7c3aed" : headerGrad.includes("059669") ? "#059669" : "#f97316"}}>{price.toLocaleString()} ₽</span>
                                        </div>
                                      )}
                                      {!isAd && item.image_path && (
                                        <div className="mt-1 text-[10px]">🖼️</div>
                                      )}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                            {/* Пагинация ◀ ▶ как у юзера */}
                            {totalLocalPages > 1 && (
                              <div className="flex items-center justify-center gap-3 pt-1">
                                <button onClick={(e) => { e.stopPropagation(); setAdminListPage(Math.max(1, curPage-1)); }}
                                  disabled={curPage <= 1}
                                  className="px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-gray-200 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed">◀</button>
                                <span className="text-xs text-gray-500">{curPage}/{totalLocalPages}</span>
                                <button onClick={(e) => { e.stopPropagation(); setAdminListPage(Math.min(totalLocalPages, curPage+1)); }}
                                  disabled={curPage >= totalLocalPages}
                                  className="px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-gray-200 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed">▶</button>
                              </div>
                            )}
                            {/* ВСЕ заявки загружаются сразу (limit: 999), пагинация локальная ◀ ▶ */}
                          </>);
                        })()}
                      </div>
                    )}

                    {/* 🗂️ Админ: архивные чаты (внутри раздела Архив, фильтр "chat") */}
                    {isAdmin && step === "admin_panel" && adminSection === "archive" && archiveFilterType === "chat" && !adminSelected && (() => {
                      const archiveChats = adminItems.filter(function(item) { return item.last_message_at; });
                      return (
                      <div className="space-y-2 fade-in">
                        {archiveChats.length === 0 ? (
                          <div className="text-center text-gray-400 text-xs py-6">📭 Нет архивных чатов</div>
                        ) : (
                          <div className="space-y-2">
                            {archiveChats.map(chat => {
                              const isExpanded = chatUser && chatUser.id === chat.dle_user_id;
                              return (
                              <div key={chat.dle_user_id} className="rounded-xl overflow-hidden shadow-sm border border-gray-200 bg-white">
                                <div className="p-3">
                                  <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2 flex-1 min-w-0 cursor-pointer" onClick={async () => {
                                      if (isExpanded) { setChatUser(null); setChatMessages([]); return; }
                                      // Загружаем сообщения чата
                                      setChatUser({ id: chat.dle_user_id, name: chat.user_name || "Без имени" });
                                      setChatMessages([]);
                                      setChatInput("");
                                      setLoading(true);
                                      const chatData = await callApi("/api/chat", { dle_user_id: chat.dle_user_id });
                                      setLoading(false);
                                      if (chatData.messages) setChatMessages(chatData.messages);
                                    }}>
                                      <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold">
                                        {(chat.user_name || "?").charAt(0).toUpperCase()}
                                      </div>
                                      <div>
                                        <div className="text-sm font-medium text-gray-800">{chat.user_name || "Без имени"}</div>
                                        <div className="text-[10px] text-gray-400">ID: {chat.dle_user_id}</div>
                                      </div>
                                      <svg className={"w-3.5 h-3.5 text-gray-300 transition-transform duration-200 flex-shrink-0 ml-auto " + (isExpanded ? "rotate-180" : "")} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                        <path d="M6 9l6 6 6-6" />
                                      </svg>
                                    </div>
                                    <div className="flex gap-1 flex-shrink-0 ml-2">
                                      <button onClick={async (e) => {
                                        e.stopPropagation();
                                        await handleUnarchiveChat(chat.dle_user_id);
                                        loadAdminSection("archive", true, "chat");
                                      }}
                                        className="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 transition-colors">
                                        📤 Разархивировать
                                      </button>
                                    </div>
                                  </div>
                                  {chat.last_message_at && (
                                    <div className="mt-2 text-[10px] text-gray-400">
                                      🕐 Последнее сообщение: {new Date(chat.last_message_at).toLocaleString("ru-RU")}
                                    </div>
                                  )}
                                  {/* Аккордеон с сообщениями чата */}
                                  {isExpanded && (
                                    <div className="mt-3 pt-3 border-t border-gray-100 space-y-2 fade-in">
                                      <div className="max-h-48 overflow-y-auto space-y-1.5 bg-gray-50 rounded-lg p-2.5 border border-gray-200">
                                        {chatMessages.length === 0 ? (
                                          <div className="text-center text-gray-400 text-[10px] py-4">💬 Нет сообщений</div>
                                        ) : (
                                          chatMessages.map(msg => {
                                            const isUserMsg = msg.sender_type === "user";
                                            return (
                                              <div key={msg.id} className={"flex " + (isUserMsg ? "justify-end" : "justify-start")}>
                                                <div className={"max-w-[80%] px-3 py-2 rounded-2xl text-xs shadow-sm " + (
                                                  isUserMsg
                                                    ? "bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-br-sm"
                                                    : "bg-white border border-gray-200 text-gray-700 rounded-bl-sm"
                                                )}>
                                                  {!isUserMsg && <div className="text-[9px] font-semibold text-blue-500 mb-0.5">👤 Админ</div>}
                                                  <div className="leading-relaxed">{msg.text}</div>
                                                  <div className={"text-[9px] mt-1 " + (isUserMsg ? "text-blue-100" : "text-gray-400")}>{msg.time_ago}</div>
                                                </div>
                                              </div>
                                            );
                                          })
                                        )}
                                      </div>
                                      <div className="flex gap-1.5">
                                        <input type="text" placeholder="Написать ответ..." value={chatInput}
                                          onChange={e => setChatInput(e.target.value)}
                                          onKeyDown={function(e) {
                                            if (e.key === "Enter") sendAdminReply();
                                          }}
                                          className="flex-1 text-xs bg-white border border-gray-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
                                        />
                                        <button onClick={sendAdminReply}
                                          className="bg-blue-600 text-white text-xs font-medium px-4 rounded-lg active:scale-95 transition-transform">
                                          → Отправить
                                        </button>
                                      </div>
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                            })}
                          </div>
                        )}
                      </div>
                    )})()}

                    {/* 👤 Юзер: список чатов */}
                    {!isAdmin && step === "admin_message" && activeRoom === "admin_message" && !activeChatId && !showNewChat && (
                      <div className="space-y-1 fade-in relative min-h-[300px]">
                        <div className="flex gap-2 items-center mb-2">
                          <div className="flex-1 bg-gray-100 rounded-lg px-3 py-2 text-xs text-gray-400">🔍 Поиск по чатам...</div>
                        </div>
                        {/* Большая кнопка, пока нет чатов */}
                        {chatMessages.length === 0 && (
                          <button onClick={function() { setShowNewChat(true); setNewChatQuery(""); setNewChatResults([]); }}
                            className="w-full py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors mb-3">+ Создать чат</button>
                        )}
                        {(() => {
                          const supportChat = {
                            id: "support",
                            name: "Чат с поддержкой",
                            avatar: "П",
                            avatarBg: "linear-gradient(135deg,#1d4ed8,#3b82f6)",
                            online: true,
                            unread: unreadCount,
                            lastMessage: chatMessages.length > 0 ? (chatMessages[chatMessages.length-1]?.text || "") : "Нет сообщений",
                            lastTime: chatMessages.length > 0 ? (chatMessages[chatMessages.length-1]?.time_ago || "") : "",
                          };
                          const allChats = [supportChat, ...FAKE_CHATS];
                          const filteredChats = allChats.filter(function(c) { return c.id === "support" ? true : deletedChats.indexOf(c.id) < 0; });
                          if (filteredChats.length === 0) {
                            return (
                              <div className="flex flex-col items-center justify-center py-16 gap-3">
                                <div className="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-2xl">💬</div>
                                <div className="text-sm text-gray-400 text-center leading-relaxed">
                                  У вас пока нет чатов<br/>
                                  Нажмите «Новый чат», чтобы начать
                                </div>
                              </div>
                            );
                          }
                          return filteredChats.map(chat => (
                            <div key={chat.id} className="relative overflow-hidden rounded-xl">
                              {chat.id !== "support" && (
                              <div className={`absolute inset-y-0 right-0 flex items-stretch transition-opacity duration-200 ${swipedChatId === chat.id ? 'opacity-100' : 'opacity-0'}`}>
                                <button onClick={() => handleArchiveChat(chat.id)}
                                  className="bg-blue-600 text-white w-16 text-[10px] font-medium flex items-center justify-center leading-tight px-1">🗂<br/>Архив</button>
                                <button onClick={() => handleDeleteChat(chat.id)}
                                  className="bg-red-500 text-white w-16 text-[10px] font-medium flex items-center justify-center leading-tight px-1">🗑<br/>Удалить</button>
                              </div>
                              )}
                              {/* Сама карточка */}
                              <div
                                onClick={() => {
                                  if (swipedChatId && swipedChatId !== chat.id) { setSwipedChatId(null); return; }
                                  if (swipedChatId === chat.id) { setSwipedChatId(null); return; }
                                  setActiveChatId(chat.id);
                                  if (chat.id === "support") {
                                    callApi("/api/chat/read", { dle_user_id: user.id }).catch(() => {});
                                    if (chatMessages.length > 0) {
                                      setChatMessages(prev => prev.map(m => ({ ...m, status: "read" })));
                                    }
                                    if (chatMessages.length === 0) {
                                      setLoading(true);
                                      callApi("/api/chat", { dle_user_id: user.id }).then(res => {
                                        if (res.messages) setChatMessages(res.messages.map(m => ({ ...m, status: "read" })));
                                        setLoading(false);
                                      }).catch(() => setLoading(false));
                                    }
                                  }
                                }}
                                onTouchStart={e => { swipeStartX.current = e.touches[0].clientX; }}
                                onTouchMove={e => {
                                  var diff = swipeStartX.current - e.touches[0].clientX;
                                  if (diff > 40) setSwipedChatId(chat.id);
                                  if (diff < -40 && swipedChatId === chat.id) setSwipedChatId(null);
                                }}
                                className={`flex items-center gap-3 px-3 py-3 rounded-xl cursor-pointer bg-white transition-transform duration-200 ${
                                  swipedChatId === chat.id ? '-translate-x-32' : 'translate-x-0'
                                }`}
                              >
                                <div className="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white flex-shrink-0" style={{background: chat.avatarBg || "#9ca3af"}}>
                                  {chat.avatar || "?"}
                                </div>
                                <div className="flex-1 min-w-0">
                                  <div className="flex justify-between items-center">
                                    <span className="text-sm font-semibold text-gray-800">{chat.name}</span>
                                    <span className="text-[10px] text-gray-400 flex-shrink-0 ml-1">{chat.lastTime}</span>
                                  </div>
                                  <div className="flex items-center gap-2 mt-0.5">
                                    <span className="text-[11px] text-gray-500 truncate flex-1">
                                      {chat.id === "support" && chatMessages.length === 0 ? "💬 Начните диалог..." : chat.lastMessage}
                                    </span>
                                    {chat.unread > 0 && (
                                      <span className="inline-flex items-center justify-center min-w-[18px] h-[18px] px-1.5 rounded-full bg-red-500 text-white text-[10px] font-bold leading-none">{chat.unread}</span>
                                    )}
                                  </div>
                                </div>
                              </div>

                        {/* Сообщение если ничего не найдено */}
                        {viewMode === "search" && searchResults && (!searchResults.items || searchResults.items.length === 0) && (
                          <div className="text-xs text-gray-400 text-center py-3">{searchResults.results}</div>
                        )}
                        {/* ◀ ▶ Навигация по страницам */}
                        {viewMode === "search" && searchResults && searchResults.totalPages > 0 && (
                          <div className="flex items-center justify-between px-1 pt-1">
                            <span className="text-[10px] text-gray-400">{searchResults.totalResults} результатов</span>
                            <div className="flex items-center gap-1">
                              <button onClick={() => handleSearchSubmit(searchResults.page - 1)}
                                disabled={searchResults.page <= 1}
                                className="px-2 py-0.5 rounded text-[11px] font-medium disabled:opacity-30 disabled:cursor-not-allowed enabled:bg-gray-100 enabled:text-gray-700 enabled:hover:bg-gray-200">◀</button>
                              <span className="px-2 py-0.5 text-[11px] text-gray-500">{searchResults.page}/{searchResults.totalPages}</span>
                              <button onClick={() => handleSearchSubmit(searchResults.page + 1)}
                                disabled={searchResults.page >= searchResults.totalPages}
                                className="px-2 py-0.5 rounded text-[11px] font-medium disabled:opacity-30 disabled:cursor-not-allowed enabled:bg-gray-100 enabled:text-gray-700 enabled:hover:bg-gray-200">▶</button>
                            </div>
                          </div>
                        )}

                        {/* ⚙️ Настройки */}
                        {viewMode === "settings" && (
                          <div className="rounded-xl overflow-hidden shadow-sm border bg-white">
                            <div className="px-3.5 py-2" style={{background:"linear-gradient(135deg,#f97316,#ea580c)"}}>
                              <span className="text-white text-xs font-bold">⚙️ Настройки</span>
                            </div>
                            <div className="p-3.5 space-y-2 text-xs text-gray-600">
                              <div className="flex items-center justify-between py-1.5 border-b border-gray-100">
                                <span>🔔 Уведомления</span>
                                <span className="text-green-600 font-medium">включены</span>
                              </div>
                              <div className="flex items-center justify-between py-1.5 border-b border-gray-100">
                                <span>🌐 Язык поиска</span>
                                <span className="text-gray-800">русский</span>
                              </div>
                              <div className="flex items-center justify-between py-1.5">
                                <span>🤖 AI-режим</span>
                                <span className="text-gray-800">обычный</span>
                              </div>
                              <div className="text-[10px] text-gray-400 pt-2 border-t border-gray-100">Больше настроек скоро появится</div>
                            </div>
                          </div>
                        )}

                        {/* 📊 Статистика — удалено, теперь это комната (рендер ниже) */}

                        {/* 📡 Каналы */}
                        {viewMode === "channels" && (
                          <div className="rounded-xl overflow-hidden shadow-sm border bg-white">
                            <div className="px-3.5 py-2" style={{background:"linear-gradient(135deg,#dc2626,#b91c1c)"}}>
                              <span className="text-white text-xs font-bold">📡 Наши каналы</span>
                            </div>
                            <div className="p-3.5 space-y-1 text-xs">
                              <div className="flex items-center gap-2 py-1.5 border-b border-gray-100">
                                <span className="text-base">📱</span>
                                <a href="https://t.me/turbinist_club" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline font-medium">Telegram</a>
                                <span className="text-gray-400 ml-auto">t.me/turbinist_club</span>
                              </div>
                              <div className="flex items-center gap-2 py-1.5 border-b border-gray-100">
                                <span className="text-base">🐻</span>
                                <a href="https://vk.com/turbinist_club" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline font-medium">VK</a>
                                <span className="text-gray-400 ml-auto">vk.com/turbinist_club</span>
                              </div>
                              <div className="flex items-center gap-2 py-1.5 border-b border-gray-100">
                                <span className="text-base">🔷</span>
                                <span className="text-gray-600 font-medium">MAX</span>
                                <span className="text-gray-400 ml-auto">скоро</span>
                              </div>
                              <div className="flex items-center gap-2 py-1.5 border-b border-gray-100">
                                <span className="text-base">📺</span>
                                <span className="text-gray-600 font-medium">YouTube</span>
                                <span className="text-gray-400 ml-auto">скоро</span>
                              </div>
                              <div className="flex items-center gap-2 py-1.5 border-b border-gray-100">
                                <span className="text-base">🎯</span>
                                <span className="text-gray-600 font-medium">Дзен</span>
                                <span className="text-gray-400 ml-auto">скоро</span>
                              </div>
                              <div className="flex items-center gap-2 py-1.5 border-b border-gray-100">
                                <span className="text-base">📷</span>
                                <span className="text-gray-600 font-medium">Instagram</span>
                                <span className="text-gray-400 ml-auto">скоро</span>
                              </div>
                              <div className="flex items-center gap-2 py-1.5">
                                <span className="text-base">🎬</span>
                                <span className="text-gray-600 font-medium">Rutub</span>
                                <span className="text-gray-400 ml-auto">скоро</span>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    ) : (<>
                    {messages.map((msg, i) => (
                      <div key={i} className={`flex ${msg.sender === "user" ? "justify-end" : "justify-start"}`}>
                        <div className={`max-w-[80%] px-3 py-2 rounded-lg text-sm whitespace-pre-wrap ${
                          msg.sender === "user"
                            ? "bg-blue-600 text-white rounded-br-sm"
                            : "bg-white border border-gray-200 text-gray-800 rounded-bl-sm shadow-sm"
                        }`}>
                          {msg.sender === "user"
                            ? msg.text
                            : <span dangerouslySetInnerHTML={{ __html: linkifyText(msg.text) }} />
                          }
                          <div className={`text-xs mt-1 ${msg.sender === "user" ? "text-blue-100" : "text-gray-400"}`}>
                            {msg.time}
                          </div>
                        </div>
                      </div>
                    ))}
                    {/* 👤 Юзер: карточки одобренных заявок на главной */}
                    {user && !isAdmin && activeRoom === "main" && userStats.loaded && (
                      <div className="grid grid-cols-2 gap-2 mb-2 fade-in">
                        <div className="rounded-xl p-2.5 text-center" style={{background:"#fff7ed",border:"1px solid #fed7aa"}}>
                          <div className="text-lg font-bold" style={{color:"#f97316"}}>
                            {userStatsData && userStatsData.ads_finance ? (userStatsData.ads_finance.approved ? userStatsData.ads_finance.approved.count : 0) : 0}
                          </div>
                          <div className="text-[10px] text-gray-500">📢 Реклама</div>
                        </div>
                        <div className="rounded-xl p-2.5 text-center" style={{background:"#eff6ff",border:"1px solid #bfdbfe"}}>
                          <div className="text-lg font-bold" style={{color:"#3b82f6"}}>
                            {userStatsData && userStatsData.news_by_status ? (userStatsData.news_by_status.approved || 0) : 0}
                          </div>
                          <div className="text-[10px] text-gray-500">📰 Новости</div>
                        </div>
                      </div>
                    )}
                    </>)}
                  </>
                )}
              </>
            )}
            <div ref={messagesEnd} />
          </div>

          {/* Кнопки действий админ-панели — фиксированные, не скроллятся */}
          {(step === "admin_panel" && adminSelected) && (
            <div className="border-t border-gray-200 bg-white px-3 py-2 space-y-2">
              {adminSelected.type === "ad" && adminSelected.status !== "Выполнена" && adminSelected.status !== "Отклонена" && (
                <>
                  <div className="flex gap-2">
                    <button onClick={() => approveAd(adminSelected.id, null)}
                      disabled={loading}
                      className="flex-1 bg-green-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-green-700 disabled:opacity-50">
                      ✅ Подтвердить
                    </button>
                    <button onClick={() => rejectAd(adminSelected.id)}
                      disabled={loading}
                      className="flex-1 bg-red-500 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-600 disabled:opacity-50">
                      ❌ Отклонить
                    </button>
                  </div>
                  <div className="flex gap-2">
                    {!adminShowCorrection ? (
                      <button onClick={() => setAdminShowCorrection(true)}
                        className="flex-1 bg-yellow-500 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-yellow-600">
                        ✏️ Скорректировать цену
                      </button>
                    ) : (
                      <div className="flex-1 flex gap-1">
                        <input type="number" placeholder="Новая цена..." value={adminCorrectionPrice}
                          onChange={e => setAdminCorrectionPrice(e.target.value)}
                          className="flex-1 border border-gray-300 rounded-lg px-2 py-1 text-sm" autoFocus />
                        <button onClick={() => approveAd(adminSelected.id, parseFloat(adminCorrectionPrice))}
                          disabled={!adminCorrectionPrice || loading}
                          className="bg-green-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-green-700 disabled:opacity-50">
                          ✅
                        </button>
                        <button onClick={() => setAdminShowCorrection(false)}
                          className="bg-gray-300 text-gray-700 px-2 py-1 rounded-lg text-xs hover:bg-gray-400">
                          ✕
                        </button>
                      </div>
                    )}
                  </div>
                </>
              )}

              {adminSelected.type === "news" && adminSelected.status !== "Выполнена" && adminSelected.status !== "Отклонена" && (
                <div className="flex gap-2">
                  <button onClick={() => approveNews(adminSelected.id)}
                    disabled={loading}
                    className="flex-1 bg-green-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-green-700 disabled:opacity-50">
                    ✅ Утвердить
                  </button>
                  <button onClick={() => rejectNews(adminSelected.id)}
                    disabled={loading}
                    className="flex-1 bg-red-500 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-600 disabled:opacity-50">
                    ❌ Отклонить
                  </button>
                </div>
              )}

              {adminSelected.type === "message" && adminSelected.status !== "answered" && (
                <div className="flex gap-2">
                  <input type="text" placeholder="Текст ответа..." value={adminReplyText}
                    onChange={e => setAdminReplyText(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") respondToMessage(adminSelected.id, adminReplyText); }}
                    className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" autoFocus />
                  <button onClick={() => respondToMessage(adminSelected.id, adminReplyText)}
                    disabled={!adminReplyText.trim() || loading}
                    className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
                    Ответить
                  </button>
                </div>
              )}

              <button onClick={() => { setAdminSelected(null); setMessages([]); }}
                className="w-full bg-gradient-to-r from-gray-100 to-gray-50 text-gray-600 px-3 py-2.5 rounded-xl text-sm font-medium hover:from-gray-200 hover:to-gray-100 transition-all shadow-sm border border-gray-200 active:scale-[0.98]">
                ← Назад к списку
              </button>
            </div>
          )}

          {/* Поле ввода — скрыто при просмотре заявки в админке */}
          {!(step === "admin_panel" && adminSelected) && (
          <div className="border-t border-gray-200 px-3 py-2 bg-white">
            {renderInputArea()}
          </div>
          )}

          {/* Меню кнопок 3×3 — только для залогиненных */}
          {step !== "start" && user && !user.anon && activeRoom === "main" && !(step === "admin_panel" && adminSelected) && (
            <div className="border-t border-gray-200 bg-gray-50 p-2">
              <div className="grid grid-cols-3 gap-1">
                {menuButtons.map(action => {
                  if (action.startsWith("dummy")) {
                    return <div key={action} className="invisible">—</div>;
                  }
                  return (
                    <button
                      key={action}
                      onClick={() => handleMenuClick(action)}
                      disabled={loading || (!user && !publicActions.includes(action))}
                      className={`text-xs py-2 px-1 rounded-md font-medium transition-colors
                        ${(!user && !publicActions.includes(action))
                          ? "bg-gray-100 text-gray-400 cursor-not-allowed"
                          : "bg-white border border-gray-200 text-gray-700 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-700 shadow-sm"
                        }`}
                    >
                      {menuLabels[action]}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* 🖼 Полноэкранный просмотр картинки */}
          {modalImage && (
            <div className="fixed inset-0 z-[99999] bg-black/85 flex items-center justify-center p-4"
              onClick={() => setModalImage(null)} style={{backdropFilter:"blur(4px)"}}>
              <div className="relative max-w-[95vw] max-h-[95vh] flex items-center justify-center">
                <img src={(window.location.origin || "") + modalImage} alt="Полный размер"
                  className="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
              </div>
              <button onClick={(e) => { e.stopPropagation(); setModalImage(null); }}
                className="absolute top-4 right-4 text-white/80 hover:text-white text-3xl leading-none w-10 h-10 flex items-center justify-center rounded-full bg-black/30 hover:bg-black/50 transition-colors">✕</button>
            </div>
          )}

          {/* 🗑 Подтверждение удаления чата */}
          {deleteConfirmId && (
            <div className="fixed inset-0 z-[99999] bg-black/50 flex items-center justify-center p-4"
              onClick={() => setDeleteConfirmId(null)}>
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl"
                onClick={(e) => e.stopPropagation()}>
                <div className="text-center">
                  <div className="text-3xl mb-3">🗑</div>
                  <h3 className="text-lg font-bold text-gray-800 mb-2">Удалить чат?</h3>
                  <p className="text-sm text-gray-500 mb-5">Все сообщения будут удалены.<br />Это действие нельзя отменить.</p>
                  <div className="flex gap-3">
                    <button onClick={() => setDeleteConfirmId(null)}
                      className="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium hover:bg-gray-200 transition-colors">Отмена</button>
                    <button onClick={() => confirmDelete()}
                      className="flex-1 py-2.5 rounded-xl bg-red-500 text-white text-sm font-medium hover:bg-red-600 transition-colors">Удалить</button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Монтирование
    const root = ReactDOM.createRoot(document.getElementById("chat-root"));
    root.render(<ChatWidget />);
  </script>
</body>
</html>
