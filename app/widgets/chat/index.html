<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Chat Bot — turbinist.ru</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* 📱 Mobile-first: бот = весь экран */
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: contain; }
    /* 💻 Десктоп: бот = окно по центру */
    @media (min-width: 481px) {
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: auto; overscroll-behavior: contain; }
    }
    select, input { font-family: inherit; }
    .admin-item { cursor: pointer; transition: background 0.15s; }
    .admin-item:hover { background: #eef2ff; }
    .admin-item:active { background: #dbeafe; }
    .fade-in { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .anim-in-first { animation: fadeIn 0.25s ease-out; }
    .anim-in-second { animation: fadeIn 0.35s ease-out; animation-fill-mode: both; animation-delay: 0.1s; }
    /* Онлайн-индикатор: зелёное кольцо */
    .avatar-wrapper { position: relative; display: inline-block; }
    .avatar-online-ring { position: absolute; inset: -3px; border-radius: 50%; border: 2.5px solid #22c55e; animation: onlinePulse 2s infinite; }
    @keyframes onlinePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .avatar-small { width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>
  <div id="chat-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ---------------------------------------------------------------
    // Конфигурация
    // ---------------------------------------------------------------
    const API_URL = "";  // относительные URL работают и с localhost, и с телефона по IP
    const PLATFORM = "web";
    // USER_ID сохраняем в localStorage, чтобы при обновлении страницы не потерять историю
    let USER_ID = localStorage.getItem("uc_user_id");
    if (!USER_ID) {
      USER_ID = "widget-" + Date.now();
      localStorage.setItem("uc_user_id", USER_ID);
    }
    const ADMIN_ID = 1;

    // ---------------------------------------------------------------
    // Главный компонент
    // ---------------------------------------------------------------
    function ChatWidget() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [inputText2, setInputText2] = useState("");
      const [step, setStep] = useState("start");
      const [authLogin, setAuthLogin] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [guestDevice, setGuestDevice] = useState(false);  // ☑ галочка «чужое устройство»
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(false);
      const [searchPage, setSearchPage] = useState(1);
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState(null);

      // Реклама
      const [adType, setAdType] = useState("feed");  // "feed" (объявление) или "banner" (баннер/статья)
      const [adCalcFlow, setAdCalcFlow] = useState("feed");  // "feed", "banner", "article" — какой калькулятор
      const [adImagePath, setAdImagePath] = useState("");  // путь к загруженной картинке
      const [adText, setAdText] = useState("");
      const [adSelectedPlatforms, setAdSelectedPlatforms] = useState([]);  // массив выбранных площадок
      const [pinPlatforms, setPinPlatforms] = useState([]);  // площадки для закрепления (частичное)
      const [adPlatforms, setAdPlatforms] = useState("all");  // строка для API
      const [adDays, setAdDays] = useState(1);
      const [adPinDays, setAdPinDays] = useState(0);  // 0 = без закрепления, иначе число дней

      // Калькулятор баннера
      const [bannerSize, setBannerSize] = useState("728x90");  // размер баннера
      const [bannerPlacement, setBannerPlacement] = useState("in_news");  // "all_pages" или "in_news"
      const [bannerMonths, setBannerMonths] = useState(1);  // на сколько месяцев
      const [bannerOptHome, setBannerOptHome] = useState(false);  // главная страница +30%
      const [bannerOptNotRelevant, setBannerOptNotRelevant] = useState(false);  // нерелевантная +30%
      const [bannerOptCustom, setBannerOptCustom] = useState(false);  // особые пожелания +30%
      const [bannerCalcPrice, setBannerCalcPrice] = useState(0);

      // Калькулятор статьи
      const [articleNotRelevant, setArticleNotRelevant] = useState(false);  // нерелевантная +30%
      const [articleEternal, setArticleEternal] = useState(false);  // вечная статья
      const [articleFixDays, setArticleFixDays] = useState(0);  // фиксация в ленте (дней)
      const [articleExchange, setArticleExchange] = useState(false);  // обмен ссылками (бесплатно)
      const [articleCalcPrice, setArticleCalcPrice] = useState(0);

      // Админ-панель
      const [adminSection, setAdminSection] = useState("ads");  // ads, news, messages, archive
      const [adminItems, setAdminItems] = useState([]);
      const [adminCounts, setAdminCounts] = useState(null);
      const [adminStats, setAdminStats] = useState(null);
      const [platformStats, setPlatformStats] = useState(null);  // статистика юзеров по платформам
      const [adminPage, setAdminPage] = useState(1);
      const [adminListPage, setAdminListPage] = useState(1);  // локальная страница для показа 5 карточек
      const [adminSelected, setAdminSelected] = useState(null);  // выбранный элемент для просмотра
      const [adminCorrectionPrice, setAdminCorrectionPrice] = useState("");  // поле коррекции цены
      const [adminShowCorrection, setAdminShowCorrection] = useState(false);
      const [adminReplyText, setAdminReplyText] = useState("");
      const [adFilterType, setAdFilterType] = useState("all");  // "all", "feed", "banner" — фильтр в рекламе
      const [archiveFilterType, setArchiveFilterType] = useState("all");  // "all", "ad", "news", "message", "chat" — фильтр в архиве
      const [priceLoading, setPriceLoading] = useState(false);  // загрузка цен в редакторе
      const [priceData, setPriceData] = useState({});          // текущие цены из БД
      const [priceEdits, setPriceEdits] = useState({});        // изменённые админом значения
      const [priceSaveStatus, setPriceSaveStatus] = useState(null);  // null | "saving" | "saved" | "error"
      const [priceTab, setPriceTab] = useState("feed");  // "feed" | "banner" | "article" — подвкладки цен
      const [prices, setPrices] = useState({});                 // цены для калькуляторов (загружаются при старте)

      const [statsTab, setStatsTab] = useState("ads");  // вкладки статистики

      // Чат с админом
      const [chatMessages, setChatMessages] = useState([]);       // история чата
      const [chatUser, setChatUser] = useState(null);              // выбранный юзер (для админа)
      const [chatUserList, setChatUserList] = useState([]);        // список чатов (для админа)
      const [chatInput, setChatInput] = useState("");              // текст нового сообщения
      const [chatLoading, setChatLoading] = useState(false);      // loading только для отправки сообщения
      const [userChats, setUserChats] = useState([]);       // список чатов юзера (реал + фейки)
      const [activeChatId, setActiveChatId] = useState(null); // какой чат открыт
      const [showNewChat, setShowNewChat] = useState(false);   // показывать экран создания чата
      const [newChatQuery, setNewChatQuery] = useState("");    // поисковый запрос на экране Новый чат
      const [newChatResults, setNewChatResults] = useState([]); // результаты поиска
      // 🖼 Режим просмотра для кнопок Поиск, Профиль, Настройки, Статистика, Каналы
      const [viewMode, setViewMode] = useState(null); // null | "search" | "settings" | "channels"
	      const [viewData, setViewData] = useState({}); // данные для viewMode

      // 📬 Счётчик непрочитанных (только админские "new", свои не считаем)
      const unreadCount = useMemo(() => {
        const count = chatMessages.filter(m => m.status === "new" && m.sender_type === "admin").length;
        return count;
      }, [chatMessages]);

      // 👆 Свайп по чату (мобильное удаление/архив)
      const [swipedChatId, setSwipedChatId] = useState(null);
      const swipeStartX = useRef(0);
      const [deletedChats, setDeletedChats] = useState([]);
      // 📱 Pull-to-refresh: обновление страницы свайпом вниз
      const [pullRefreshState, setPullRefreshState] = useState("idle"); // "idle" | "pulling" | "loading"
      const pullStartY = useRef(0);
      const pullDistance = useRef(0);
      const scrollRef = useRef(null);

	// 🗑 Архив / удаление чата
	const [deleteConfirmId, setDeleteConfirmId] = useState(null);
	const [archivedUserChats, setArchivedUserChats] = useState([]);
	async function handleArchiveChat(chatId) {
		setSwipedChatId(null);
		try {
			const res = await callApi("/api/chat/archive", { dle_user_id: parseInt(chatId) || 0 });
			if (!res.error) {
				// Убираем чат из списка
				setDeletedChats(function(prev) { return prev.concat([chatId]); });
				// Обновляем счётчики если админ
				if (isAdmin) loadAdminCounts();
			}
		} catch(e) { console.error("Ошибка архивации чата:", e); }
	}
	function handleDeleteChat(chatId) {
		setSwipedChatId(null);
		setDeleteConfirmId(chatId);
	}
	async function confirmDelete() {
		var chatId = deleteConfirmId;
		setDeleteConfirmId(null);
		try {
			const res = await callApi("/api/chat/delete", { dle_user_id: parseInt(chatId) || 0 });
			if (!res.error) {
				setDeletedChats(function(prev) { return prev.concat([chatId]); });
				if (isAdmin) loadAdminCounts();
			}
		} catch(e) { console.error("Ошибка удаления чата:", e); }
	}
	async function handleUnarchiveChat(chatId) {
		try {
			const res = await callApi("/api/chat/unarchive", { dle_user_id: parseInt(chatId) || 0 });
			if (!res.error) {
				// Для админа список перезагрузится через loadAdminSection
				// Для обычного пользователя — фильтруем archivedUserChats
				if (!isAdmin) {
					setArchivedUserChats(function(prev) { return prev.filter(function(id) { return id !== chatId; }); });
				}
				if (isAdmin) loadAdminCounts();
			}
		} catch(e) { console.error("Ошибка разархивации чата:", e); }
	}
      // Клик вне чата — закрываем свайп
      useEffect(function() {
        if (!swipedChatId) return;
        function handler(e) {
          setSwipedChatId(null);
        }
        document.addEventListener("click", handler);
        return function() { document.removeEventListener("click", handler); };
      }, [swipedChatId]);
      // 🔍 Поиск пользователей на экране Новый чат (debounce 300мс)
      const searchTimerRef = useRef(null);
      useEffect(function() {
        if (!showNewChat || !newChatQuery || newChatQuery.trim().length < 2) {
          setNewChatResults([]);
          return;
        }
        if (searchTimerRef.current) clearTimeout(searchTimerRef.current);
        searchTimerRef.current = setTimeout(async function() {
          try {
            var res = await callApi("/api/users/search", { q: newChatQuery.trim(), dle_user_id: user?.id || 0 });
            setNewChatResults(res.users || []);
          } catch(e) { setNewChatResults([]); }
        }, 300);
        return function() { if (searchTimerRef.current) clearTimeout(searchTimerRef.current); };
      }, [newChatQuery, showNewChat]);
      // 🏠 Комнаты
      // Админ: main, advertise, news, admin_message, archive
      // Юзер:  main, advertise, news, admin_message
      const [activeRoom, setActiveRoom] = useState("main");
      const [userStatsData, setUserStatsData] = useState(null);  // 📊 данные статистики юзера
      const [roomMessages, setRoomMessages] = useState({ main: [], profile: [], advertise: [], news: [], admin_message: [], archive: [], stats: [] });
      const activeRoomRef = useRef("main");  // синхронный ref для addBotMessage после switchRoom
      const roomMessagesRef = useRef(roomMessages);  // синхронный ref — ВСЕГДА актуальный, без задержки рендера
      const roomStepsRef = useRef({ main: "main" });  // 🔒 каждая комната помнит свой step
      useEffect(() => { activeRoomRef.current = activeRoom; }, [activeRoom]);
      useEffect(() => { roomStepsRef.current = { ...roomStepsRef.current, [activeRoom]: step }; }, [step, activeRoom]);

      const messagesEnd = useRef(null);
      const adminLoadTimerRef = useRef(null);  // ID таймера loadAdminSection — чтобы отменять старые
      const isAdmin = user && user.id === ADMIN_ID;

      // 🎭 Фейковые чаты будут тут после реализации юзер-юзер
      const FAKE_CHATS = [];

      // 🟢 Онлайн-статус
      const [userOnline, setUserOnline] = useState({});  // { [dle_user_id]: { online: true/false, last_active: "..." } }

      // 📋 Списки заявок юзера (карточки вместо текста)
      const [userAdItems, setUserAdItems] = useState([]);
      const [userAdPage, setUserAdPage] = useState(1);
      const [userAdViewItem, setUserAdViewItem] = useState(null);
      const [userNewsItems, setUserNewsItems] = useState([]);
      const [userNewsPage, setUserNewsPage] = useState(1);
      const [userNewsViewItem, setUserNewsViewItem] = useState(null);
      const [userStats, setUserStats] = useState({ ads: 0, news: 0, messages: 0, loaded: false });
      const [modalImage, setModalImage] = useState(null);  // полноэкранный просмотр картинки
      const [articleMonths, setArticleMonths] = useState(1);  // месяцев для невечной статьи

      useEffect(() => {
        messagesEnd.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      // 🟢 Опрос онлайн-статуса каждые 30 секунд
      useEffect(() => {
        if (!user) return;
        const ping = async () => {
          await callApi("/api/ping", { dle_user_id: user.id, username: user.username });
        };
        ping(); // первый раз сразу
        const interval = setInterval(ping, 30000);
        return () => clearInterval(interval);
      }, [user]);

      // 🟢 Проверка онлайна: админ — всех юзеров из списка, юзер — админа
      useEffect(() => {
        if (!user) return;
        const checkOnline = async () => {
          if (isAdmin) {
            // Админ: проверяем всех юзеров из списка чатов
            const ids = new Set();
            if (chatUser) ids.add(chatUser.id);
            for (const c of chatUserList) ids.add(c.dle_user_id);
            for (const uid of ids) {
              const res = await callApi(`/api/online/${uid}`);
              setUserOnline(prev => ({ ...prev, [uid]: res }));
            }
          } else {
            // Юзер: проверяем онлайн админа
            const res = await callApi(`/api/online/${ADMIN_ID}`);
            setUserOnline(prev => ({ ...prev, [ADMIN_ID]: res }));
          }
        };
        checkOnline();
        const interval = setInterval(checkOnline, 15000);
        return () => clearInterval(interval);
      }, [user, chatUser, chatUserList, isAdmin]);

      // 💰 Загрузка цен при старте
      useEffect(() => {
        callApi("/api/prices", {}).then(data => {
          if (data.prices) setPrices(data.prices);
        }).catch(() => {});
      }, []);

      useEffect(() => {
        // Сначала sessionStorage (чужое устройство), потом localStorage (своё)
        const saved = sessionStorage.getItem("uc_session") || localStorage.getItem("uc_session");
        if (saved) {
          try {
            const u = JSON.parse(saved);
            setUser(u);
            switchRoom("main"); setStep("main");
            // 🔒 Админ: загружаем счётчики сразу при старте (enterRoom не вызывается)
            if (u.id === ADMIN_ID) {
              (async () => {
                const countsData = await callApi("/api/admin/panel", { dle_user_id: u.id, section: "ads", page: 1, limit: 1 });
                if (countsData.counts) setAdminCounts(countsData.counts);
              })();
              (async () => {
                const platData = await callApi("/api/admin/bot-users", { dle_user_id: u.id });
                if (!platData.error) setPlatformStats(platData);
              })();
            } else {
              // 👤 Обычный юзер: загружаем статистику для карточек и приветствия
              (async () => {
                var approvedAds = 0;
                var approvedNews = 0;
                try {
                  const myData = await callApi("/api/my/requests", { dle_user_id: u.id });
                  try {
                    const chat = await callApi("/api/chat", { dle_user_id: u.id });
                    setChatMessages(chat.messages || []);
                  } catch (e) {}
                  try {
                    const statsRes = await callApi("/api/my/stats", { dle_user_id: u.id });
                    if (statsRes && !statsRes.error) {
                      setUserStatsData(statsRes);
                      approvedAds = (statsRes.ads_finance && statsRes.ads_finance.approved) ? statsRes.ads_finance.approved.count : 0;
                      approvedNews = (statsRes.news_by_status && statsRes.news_by_status.approved) ? statsRes.news_by_status.approved : 0;
                    }
                  } catch (e) {}
                } catch (e) {}
                var total = approvedAds + approvedNews;
                setUserStats({ loaded: true });
                if (total > 0) {
                  addBotMessage(`👋 С возвращением, ${u.username}!\n\n✅ Админ одобрил ${total} ваши заявки`);
                } else {
                  addBotMessage("👋 С возвращением, " + u.username + "!\n\n⏳ Заявки надо доработать");
                }
              })();
            }
            // addBotMessage removed — admin dashboard replaces old greetings
            // Админ-дашборд покажется в messages area, старые облачка убраны
            return; // не показываем окно авторизации
          } catch(e) { localStorage.removeItem("uc_session"); sessionStorage.removeItem("uc_session"); }
        }
        // Восстанавливаем анонимную сессию (если была)
        const anonSession = localStorage.getItem("uc_anon_session");
        if (anonSession) {
          try {
            const guest = JSON.parse(anonSession);
            setUser(guest);
            setStep("anon_chat");
            switchRoom("main");
            // Загружаем историю сообщений с сервера
            (async () => {
              try {
                const res = await fetch(`${API_URL}/api/chat/anonymous-get?platform_user_id=${USER_ID}`);
                const data = await res.json();
                if (data.messages && data.messages.length > 0) {
                  const msgs = data.messages.map(m => ({
                    sender: m.sender_type === "admin" ? "bot" : "user",
                    text: m.text,
                    time: new Date(m.created_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
                  }));
                  setRoomMessages(prev => ({ ...prev, main: msgs }));
                  setMessages(msgs);
                  // Запоминаем последний ID админского сообщения
                  const adminMsgs = data.messages.filter(m => m.sender_type === "admin");
                  if (adminMsgs.length > 0) {
                    sessionStorage.setItem("uc_last_admin_id", adminMsgs[adminMsgs.length - 1].id);
                  }
                }
              } catch(e) {}
            })();
            return; // не показываем окно авторизации
          } catch(e) { localStorage.removeItem("uc_anon_session"); }
        }
        addBotMessage(
          "👋 Приветствуем на turbinist.ru!\n\n" +
          "Для доступа к функциям бота необходимо авторизоваться.\n\n" +
          "Введите ваш логин (email или имя пользователя с сайта):"
        );
      }, []);

      // ---------------------------------------------------------------
      // API
      // ---------------------------------------------------------------
      async function callApi(endpoint, data = {}) {
        // GET-запросы: welcome, panel, count, my/requests, my/notifications
        const isGet = endpoint === "/api/admin/welcome" ||
                      endpoint === "/api/admin/panel" ||
                      endpoint === "/api/admin/stats" ||
                      endpoint === "/api/admin/messages/count" ||
                      endpoint === "/api/admin/bot-users" ||
                      endpoint === "/api/my/stats" ||
                      endpoint === "/api/my/requests" ||
                      endpoint === "/api/my/notifications" ||
                      endpoint === "/api/chat" ||
                      endpoint === "/api/chat/exists" ||
                      endpoint === "/api/admin/chats" ||
                      endpoint === "/api/admin/chats/archived" ||
                      endpoint === "/api/prices" ||
                      endpoint === "/api/users/search" ||
                      endpoint.startsWith("/api/online/");
        if (isGet) {
          const params = new URLSearchParams(data).toString();
          const response = await fetch(`${API_URL}${endpoint}?${params}`);
          return response.json();
        }
        const response = await fetch(`${API_URL}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${response.status}`);
        }
        return response.json();
      }

      let _dbgBotC = 0;
      function addBotMessage(text) {
        const room = activeRoomRef.current;
        _dbgBotC++;
        console.log(`🐛 BOT #${_dbgBotC} → room=[${room}] text="${text.substring(0,40)}" activeRoomState=${activeRoom}`);
        const msg = { sender: "bot", text, time: new Date().toLocaleTimeString() };
        setMessages(prev => [...prev, msg]);
        setRoomMessages(prev => {
          const next = { ...prev, [room]: [...(prev[room] || []), msg] };
          roomMessagesRef.current = next;  // 🔒 мгновенная синхронизация рефа
          return next;
        });
      }

      let _dbgUserC = 0;
      function addUserMessage(text) {
        const room = activeRoomRef.current;
        _dbgUserC++;
        console.log(`🐛 USER #${_dbgUserC} → room=[${room}] text="${text.substring(0,40)}" activeRoomState=${activeRoom}`);
        const msg = { sender: "user", text, time: new Date().toLocaleTimeString() };
        setMessages(prev => [...prev, msg]);
        setRoomMessages(prev => {
          const next = { ...prev, [room]: [...(prev[room] || []), msg] };
          roomMessagesRef.current = next;  // 🔒 мгновенная синхронизация рефа
          return next;
        });
      }

      // Переключение комнаты
      // Сообщения НЕ сохраняем здесь — они уже сохранены через addBotMessage/addUserMessage.

      function switchRoom(room) {
        if (room === activeRoomRef.current) { console.log(`🐛 SWITCH #${_dbgSwitchC+1} SKIP — already in [${room}]`); return; }
        _dbgSwitchC++;
        const oldRoom = activeRoomRef.current;

        let savedStep = roomStepsRef.current[room] || "main";

      function linkifyText(text) {
        // Обработка картинок: {{img:путь}} → <img>
        const imgPlaceholders = [];
        const withImgPlaceholders = text.replace(
          /\{\{img:([^}]+)\}\}/g,
          (_, path) => {
            imgPlaceholders.push(`<img src="${API_URL + path}" class="max-w-full max-h-48 rounded-lg object-contain" />`);
            return `\x00IMG${imgPlaceholders.length - 1}\x00`;
          }
        );
        const escaped = withImgPlaceholders
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        // Восстанавливаем <img> теги (неэкранированные)
        const withImages = escaped.replace(
          /\x00IMG(\d+)\x00/g,
          (_, idx) => imgPlaceholders[parseInt(idx, 10)]
        );
        // Ссылки
        return withImages.replace(
          /(https?:\/\/[^\s<>]+)/g,
          '<a href="$1" target="_blank" class="text-blue-600 underline break-all">$1</a>'
        );
      }

      // Переключение площадки (галочка)
      function togglePlatform(key) {
        setAdSelectedPlatforms(prev => {
          if (key === "all") {
            // Нажали «все» — очищаем остальные, ставим «все»
            return prev.includes("all") ? [] : ["all"];
          }
          // Нажали отдельную площадку
          let next = prev.filter(p => p !== "all");  // убираем «все»
          if (next.includes(key)) {
            next = next.filter(p => p !== key);  // убираем если уже была
          } else {
            next = [...next, key];  // добавляем
          }
          // Если выбраны все 4 — заменяем на «все»
          if (next.length === 4) return ["all"];
          return next;
        });
      }

      function calcAdPrice(platformsStr, days, pinDays, pinPlats) {
        // Берём цены из БД (если не загружены — используем значения по умолчанию)
        const sitePrice = prices.feed_site?.base_price || 0;
        const pinPerDay = prices.feed_pin_single?.base_price || 0;
        const platPrices = { site: sitePrice, tg: sitePrice, vk: sitePrice, max: sitePrice };
        let base;
        if (platformsStr === "all") {
          const allKeys = Object.keys(platPrices);
          base = allKeys.reduce((sum, k) => sum + platPrices[k], 0);
        } else {
          const selected = platformsStr.split(",").filter(k => k in platPrices);
          base = selected.reduce((sum, k) => sum + (platPrices[k] || sitePrice), 0);
        }
        const dayPrice = base * days;
        let total = dayPrice;
        if (pinDays > 0) {
          // pinPlats — массив выбранных площадок для закрепления; если пуст или "all" — все площадки
          let numPinPlats;
          if (pinPlats && pinPlats.length > 0 && !pinPlats.includes("all")) {
            numPinPlats = pinPlats.length;
          } else {
            numPinPlats = platformsStr === "all" ? 4 : platformsStr.split(",").filter(k => k in platPrices).length;
          }
          total += Math.round(pinPerDay * numPinPlats * pinDays);
        }
        return total;
      }

      // 📊 Разбивка цены для карточки (feed/banner/article)
      function getPriceBreakdown(it) {
        const iconMap = { site: "🌐", tg: "📱", vk: "🐱", max: "📡" };
        const labelMap = { site: "Сайт", tg: "Telegram", vk: "VK", max: "MAX" };
        const lines = []; let total = 0;
        if (!it || !it.ad_type) return { lines, total };
        if (it.ad_type === "feed") {
          const sitePrice = prices.feed_site?.base_price || 0;
          const platPrices = { site: sitePrice, tg: sitePrice, vk: sitePrice, max: sitePrice };
          const platforms = it.platform_target === "all"
            ? ["site","tg","vk","max"]
            : (it.platform_target || "").split(",").map(k => k.trim()).filter(k => platPrices[k]);
          const days = it.days || 1;
          let subtotal = 0;
          for (const p of platforms) {
            const pp = platPrices[p] || sitePrice;
            const lt = pp * days;
            lines.push({ icon: iconMap[p] || p, label: labelMap[p] || p, pricePer: pp, period: days, unit: "дн.", total: lt, type: "calc" });
            subtotal += lt;
          }
          total = subtotal;
          if (it.pin && (it.pin_days || 0) > 0) {
            const pinPerDay = prices.feed_pin_single?.base_price || 0;
            let pinPlatCount;
            if (it.pin_platforms && it.pin_platforms !== "all") {
              pinPlatCount = it.pin_platforms.split(",").length;
            } else {
              pinPlatCount = platforms.length;
            }
            const pinTotal = Math.round(pinPerDay * pinPlatCount * it.pin_days);
            lines.push({ icon: "📌", label: "Закрепление", pricePer: pinPerDay, period: pinPlatCount, unit: `× ${it.pin_days} дн.`, total: pinTotal, type: "pin" });
            total += pinTotal;
          }
        } else if (it.ad_type === "banner") {
          const bannerPriceData = prices.banner_in_news || {};
          const basePrice = bannerPriceData.base_price || 0;
          const nrPct = bannerPriceData.surcharge_pct || 0;  // наценка нерелевантной из БД
          const months = it.banner_months || 1;
          lines.push({ icon: "💰", label: "Базовая цена", pricePer: basePrice, period: months, unit: "мес.", total: basePrice * months, type: "calc" });
          let multiplier = 1;
          let surchargeLabels = [];
          if (it.banner_opts) {
            const opts = it.banner_opts.split(",").map(o => o.trim());
            if (opts.includes("home")) { multiplier += 0.3; surchargeLabels.push("🏠 главная"); }
            if (opts.includes("not_relevant") && nrPct > 0) { multiplier += nrPct; surchargeLabels.push("📌 нерелев."); }
            if (opts.includes("custom")) { multiplier += 0.3; surchargeLabels.push("✏️ пожелания"); }
          }
          if (multiplier > 1) {
            const surchargeTotal = Math.round(basePrice * (multiplier - 1) * months);
            lines.push({ icon: "⚡", label: `Наценки: ×${multiplier.toFixed(1)}`, note: surchargeLabels.join(", "), total: surchargeTotal, type: "surcharge" });
          }
          total = Math.round(basePrice * multiplier * months);
        } else if (it.ad_type === "article") {
          const articleBase = prices.article_base?.base_price || 0;
          const articleSurchargePct = prices.article_base?.surcharge_pct || 0;
          const notRelSurchargePerMonth = (it.article_opts || "").includes("not_relevant") ? Math.round(articleBase * articleSurchargePct) : 0;
          const isEternal = it.article_eternal;
          if (isEternal) {
            total = articleBase + notRelSurchargePerMonth;
            lines.push({ icon: "📰", label: "Статья вечная", pricePer: articleBase, period: 1, unit: "шт.", total: articleBase, type: "calc" });
            if (notRelSurchargePerMonth > 0) {
              lines.push({ icon: "📌", label: "Нерелевантная", note: `×${(1 + articleSurchargePct).toFixed(1)}`, total: notRelSurchargePerMonth, type: "surcharge" });
            }
          } else {
            const months = it.article_months || 1;
            const baseTotal = articleBase * months;
            total = baseTotal;
            lines.push({ icon: "📰", label: "Статья", pricePer: articleBase, period: months, unit: "мес.", total: baseTotal, type: "calc" });
            if (notRelSurchargePerMonth > 0) {
              const surchargeTotal = notRelSurchargePerMonth * months;
              lines.push({ icon: "📌", label: "Нерелевантная", note: `×${(1 + articleSurchargePct).toFixed(1)}`, total: surchargeTotal, type: "surcharge" });
              total += surchargeTotal;
            }
            if ((it.article_fix_days || 0) > 0) {
              const fixPerDay = prices.article_fixation?.base_price || 0;
              const fixTotal = it.article_fix_days * fixPerDay * months;
              lines.push({ icon: "📌", label: `Фиксация ${it.article_fix_days} дн.`, pricePer: fixPerDay, period: it.article_fix_days, unit: "дн.", total: fixTotal, type: "calc" });
              total += fixTotal;
            }
          }
        }
        return { lines: lines.filter(l => l !== null), total };
      }

        setPinPlatforms(prev => {

          }
          let next = prev.filter(p => p !== "all");
          if (next.includes(key)) {
            next = next.filter(p => p !== key);
          } else {
            next = [...next, key];
          }
          // Если выбрали все площадки — автоматически "все"
          const allPlats = adSelectedPlatforms.includes("all")
            ? ["site", "tg", "vk", "max"]

          return next;

      // Загрузить раздел (silent — без сообщений в чат, для перезагрузки)
      async function loadAdminSection(section, silent = false, filterType = null) {
        // 🔒 Защита №1: не загружать, если комната не соответствует секции
        const roomSectionMap = { advertise: "ads", news: "news", admin_message: "messages", admin_stats: "stats", archive: "archive" };
        if (roomSectionMap[activeRoomRef.current] !== section) return;

        // 📌 Захватываем комнату ДО асинхронных вызовов
        const targetRoom = activeRoomRef.current;

        // Сбрасываем UI, НО adminSection НЕ трогаем — его установит только успешный ответ
        setAdminPage(1);
        setAdminSelected(null);
        setChatUser(null);
        setChatMessages([]);
        setChatInput("");
        setAdFilterType("all");  // сброс фильтра при смене раздела
        setLoading(true);

        // Для сообщений — загружаем список чатов
        if (section === "messages") {
          const chatsData = await callApi("/api/admin/chats", { dle_user_id: user.id });
          setLoading(false);
          // 🔒 Повторная проверка: за время API-запроса комната могла смениться
          if (roomSectionMap[activeRoomRef.current] !== section) return;
          if (!chatsData.error) {
            setChatUserList(chatsData.chats || []);
            // ✅ adminSection ставим ТОЛЬКО после успешного ответа
            setAdminSection(section);
          }
          return;
        }

        // 📊 Статистика — загружаем через отдельный API
        if (section === "stats") {
          const statsData = await callApi("/api/admin/stats", { dle_user_id: user.id });
          setLoading(false);
          if (roomSectionMap[activeRoomRef.current] !== section) return;
          if (!statsData.error) {
            setAdminStats(statsData);
            setAdminSection(section);
          }
          return;
        }

        // 🗂 Архивные чаты — загружаем через отдельный API (при фильтре "chat")
        if (section === "archive" && filterType === "chat") {
          const archivedData = await callApi("/api/admin/chats/archived", {});
          setLoading(false);
          if (roomSectionMap[activeRoomRef.current] !== section) return;
          if (!archivedData.error) {
            setAdminItems(archivedData.chats || []);
            setAdminSection(section);
          }
          return;
        }

        const data = await callApi("/api/admin/panel", { dle_user_id: user.id, section, page: 1, limit: 999 });
        setLoading(false);

        // 🔒 Повторная проверка: за время API-запроса комната могла смениться
        if (roomSectionMap[activeRoomRef.current] !== section) return;

        if (data.error) {
          if (!silent) addBotMessage(data.error);
          return;
        }

      async function savePrices() {
        if (Object.keys(priceEdits).length === 0) return;
        setPriceSaveStatus("saving");
        const result = await callApi("/api/admin/prices", {
          dle_user_id: user.id,
          updates: priceEdits,
        });
        if (result.status === "ok") {
          const applyUpdates = (prev) => {
            const updated = {...prev};
            for (const [key, val] of Object.entries(priceEdits)) {
              if (updated[key]) updated[key] = {...updated[key], ...val};
            }
            return updated;
          };
          setPriceData(applyUpdates);
          setPrices(applyUpdates);  // синхронизируем калькуляторы юзера
          setPriceEdits({});
          setPriceSaveStatus("saved");
          addBotMessage("✅ Цены сохранены! Новые значения применятся к следующим заявкам.");
        } else {
          setPriceSaveStatus("error");
          addBotMessage("❌ " + (result.message || "Ошибка сохранения цен"));
        }
      }

      // ---------------------------------------------------------------
      // Обработка Enter
      // ---------------------------------------------------------------
      function handleKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (step === "search" && inputText) handleSearchSubmit(1);
          else if (step === "ad_type" && inputText) handleAdTypeSubmit();
          else if (step === "ad_text" && inputText) handleAdTextSubmit();
          else if (step === "banner_months" && inputText) {
            const m = parseInt(inputText); if (m >= 1) { setBannerMonths(m); const bp = bannerPlacement === "all_pages" ? prices.banner_all_pages : prices.banner_in_news; const base = bp?.base_price || 0; const nr = bp?.surcharge_pct || 0; let s = 1; if (bannerOptHome) s+=0.3; if (bannerOptNotRelevant) s+=nr; if (bannerOptCustom) s+=0.3; setBannerCalcPrice(Math.round(base*s*m)); setInputText(""); setStep("ad_text"); }
          }
          else if (step === "article_fixation" && inputText) {
            const d = parseInt(inputText) || 0; setArticleFixDays(d); let price = prices.article_base?.base_price || 0; if (articleNotRelevant) price = Math.round(price * (1 + (prices.article_base?.surcharge_pct || 0))); if (d > 0) price += d * (prices.article_fixation?.base_price || 0); setArticleCalcPrice(price); setInputText(""); setStep("ad_text");
          }
          else if (step === "ad_days" && inputText) handleAdDaysSubmit();
          else if (step === "ad_pin" && inputText) handleAdPinSubmit();
          else if (step === "news_title" && inputText) handleNewsTitleSubmit();
          else if (step === "news_text" && inputText) handleNewsTextSubmit();
          else if (step === "admin_message" && chatInput) sendChatMessage();
          else if (step === "anon_chat" && inputText) handleAnonSend();
        }
      }

            <div className="flex-1 flex gap-2">
              <input type="number" min="1" placeholder="Количество месяцев..." value={inputText}

                  if (e.key === "Enter") {
                    const m = parseInt(inputText);
                    if (m >= 1) {
                      setBannerMonths(m);
                      // Считаем цену
                      const bp = bannerPlacement === "all_pages" ? prices.banner_all_pages : prices.banner_in_news;
                      const base = bp?.base_price || 0;
                      const nr = bp?.surcharge_pct || 0;
                      let surcharge = 1;
                      if (bannerOptHome) surcharge += 0.3;
                      if (bannerOptNotRelevant) surcharge += nr;
                      if (bannerOptCustom) surcharge += 0.3;
                      const total = Math.round(base * surcharge * m);
                      setBannerCalcPrice(total);
                      addUserMessage(`Месяцев: ${m}`);
                      addBotMessage(`💰 Расчёт:\nБаза: ${base}₽/мес × ${m} мес.${surcharge > 1 ? ` × ${surcharge.toFixed(1)} (надбавки)` : ""}\nИтого: ${total}₽\n\n📝 Опишите ваш баннер (содержание, ссылка):`);
                      setInputText("");
                      setStep("ad_text");
                    }
                  }
                }}
                className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" autoFocus />
              <button onClick={() => {
                const m = parseInt(inputText);
                if (m >= 1) {
                  setBannerMonths(m);
                  const bp = bannerPlacement === "all_pages" ? prices.banner_all_pages : prices.banner_in_news;
                  const base = bp?.base_price || 0;
                  const nr = bp?.surcharge_pct || 0;
                  let surcharge = 1;
                  if (bannerOptHome) surcharge += 0.3;
                  if (bannerOptNotRelevant) surcharge += nr;
                  if (bannerOptCustom) surcharge += 0.3;
                  const total = Math.round(base * surcharge * m);
                  setBannerCalcPrice(total);
                  addUserMessage(`Месяцев: ${m}`);
                  addBotMessage(`💰 Расчёт:\nБаза: ${base}₽/мес × ${m} мес.${surcharge > 1 ? ` × ${surcharge.toFixed(1)} (надбавки)` : ""}\nИтого: ${total}₽\n\n📝 Опишите ваш баннер (содержание, ссылка):`);
                  setInputText("");
                  setStep("ad_text");
                }
              }}
                className="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-purple-700">Далее</button>
              <button onClick={() => setStep("banner_options")} className="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">← Назад</button>
              <button onClick={cancelAdFlow} className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>
            </div>

        // ── Калькулятор СТАТЬИ ──
        // Шаг 1: опции
        if (step === "article_options") {
          const articleBase = prices.article_base?.base_price || 0;

          const articleEternalBase = prices.article_eternal?.base_price || 0;
          const articleEternalSurcharge = prices.article_eternal?.surcharge_pct || 0;
          const fixPerDay = prices.article_fixation?.base_price || 0;

          const goNext = (eternal, notRelevant) => {
            setArticleEternal(eternal);
            setArticleNotRelevant(notRelevant);
            let price;
            if (eternal) {
              price = notRelevant
                ? Math.round(articleEternalBase * (1 + articleEternalSurcharge))
                : articleEternalBase;
              // Вечная — без фиксации, сразу к тексту
              setArticleFixDays(0);
              setArticleCalcPrice(price);
              setStep("ad_text");
              addBotMessage(
                `📰 СТАТЬЯ ВЕЧНАЯ${notRelevant ? " (нерелевантная)" : ""}\n` +
                `💰 Цена: ${price}₽\n\n📝 Опишите вашу статью (тема, содержание, ссылки):`
              );
            } else {
              price = notRelevant
                ? Math.round(articleBase * (1 + articleBaseSurcharge))
                : articleBase;
              setArticleCalcPrice(price);
              setStep("article_months");
              setInputText("");
              addBotMessage(
                `📅 На сколько месяцев публикуем статью?\n\n` +
                `Базовая цена: ${price}₽/мес\n\nВведите количество месяцев (1, 2, 3...):`

          };

          return (
            <div className="flex-1 space-y-1">
              <div className="text-xs text-gray-500 mb-1">

              </div>
              {/* Обычная релевантная */}
              <button onClick={() => goNext(false, false)}
                className="w-full px-3 py-2 rounded-lg text-sm text-left bg-gray-50 border border-gray-200 text-gray-600 hover:bg-gray-100">

              </button>
              {/* Обычная нерелевантная */}
              <button onClick={() => goNext(false, true)}
                className="w-full px-3 py-2 rounded-lg text-sm text-left bg-yellow-50 border border-yellow-200 text-yellow-800 hover:bg-yellow-100">

              {/* Вечная релевантная */}
              <button onClick={() => goNext(true, false)}

              <button onClick={() => { setArticleExchange(!articleExchange); }}

                <button onClick={cancelAdFlow} className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>

                const m = parseInt(inputText) || 1;
                setArticleMonths(m);
                const basePrice = articleNotRelevant ? Math.round(articleBase * 1.3) : articleBase;
                setArticleCalcPrice(basePrice * m);

              <button onClick={cancelAdFlow} className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>
            </div>
          );

        // Картинка (опционально) — реальная загрузка

          return (
            <div className="flex-1 space-y-2">
              <div className="text-xs text-gray-500">🖼 Приложите картинку (необязательно):</div>
              <div className="flex gap-2 items-center">
                <input type="file" accept="image/*" id="ad-image-input"
                  onChange={async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    setLoading(true);
                    try {
                      const formData = new FormData();
                      formData.append("file", file);
                      formData.append("dle_user_id", String(user?.id || 0));
                      const resp = await fetch(API_URL + "/api/upload/ad-image", { method: "POST", body: formData });
                      const data = await resp.json();
                      if (data.path) {
                        setAdImagePath(data.path);
                        addUserMessage(`🖼 Картинка загружена: ${data.filename}`);
                      }
                    } catch(e) {
                      addBotMessage("⚠️ Ошибка загрузки картинки.");
                    }
                    setLoading(false);
                    e.target.value = ""; // сброс чтобы можно было перезагрузить тот же файл

                  className="flex-1 text-xs border border-gray-300 rounded-lg px-2 py-1.5 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />

                  className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>

        if (step === "ad_text") {
          return (
            <div className="flex-1 flex gap-2">
              <input type="text" placeholder="Текст объявления..." value={inputText}
                onChange={e => setInputText(e.target.value)} onKeyDown={handleKeyDown}
                className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" autoFocus />
              <button onClick={handleAdTextSubmit}
                className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Далее</button>
              <button onClick={() => {
                if (adCalcFlow === "banner") setStep("banner_months");
                else if (adCalcFlow === "article") setStep("article_fixation");

              }}
                className="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">Назад</button>
              <button onClick={cancelAdFlow}
                className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>

        if (step === "ad_platforms") {

            { key: "site", label: "Сайт", price: sp },
            { key: "tg", label: "Telegram", price: sp },

            { key: "max", label: "MAX", price: sp },
            { key: "all", label: "Все площадки", price: sp * 4 },

          return (
            <div className="flex-1 space-y-2">
              <div className="grid grid-cols-2 gap-1">
                {platforms.map(p => {

                  return (
                    <button key={p.key} onClick={() => togglePlatform(p.key)}
                      className={`px-2 py-1.5 rounded-lg text-xs font-medium border transition-colors ${btnClass}`}>
                      {selected ? "☑" : "☐"} {p.label} — {p.price}₽
                    </button>

              <div className="flex gap-2">
                <button onClick={handleAdPlatformsSubmit}
                  disabled={adSelectedPlatforms.length === 0}

                  Далее {adSelectedPlatforms.length > 0 ? `(${adSelectedPlatforms.length})` : ""}
                </button>
                <button onClick={() => { setStep("ad_text"); setAdSelectedPlatforms([]); }}
                  className="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">← Назад</button>

                  className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>
              </div>
            </div>
          );

        if (step === "ad_days") {
          return (
            <div className="flex-1 flex gap-2">
              <input type="number" min="1" placeholder="Количество дней..." value={inputText}
                onChange={e => setInputText(e.target.value)} onKeyDown={handleKeyDown}
                className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" autoFocus />
              <button onClick={handleAdDaysSubmit}
                className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Далее</button>
              <button onClick={() => { setStep("ad_platforms"); setInputText(""); }}
                className="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">← Назад</button>
              <button onClick={cancelAdFlow}
                className="bg-red-50 border border-red-200 text-red-600 px-2 py-2 rounded-lg text-xs hover:bg-red-100">✕</button>

          const allPlats = adSelectedPlatforms.includes("all")

      // ---------------------------------------------------------------
      // Аноним начинает чат
      // ---------------------------------------------------------------
      function handleStartChat() {
        const displayName = guestDevice || !authLogin.trim() ? "Гость" : authLogin.trim();
        const guestSession = { anon: true, name: displayName, id: "anon-" + Date.now() };
        setUser(guestSession);
        setStep("anon_chat");
        setMessages([{
          id: Date.now(),
          sender: "bot",
          text: displayName === "Гость"
            ? "👋 Добро пожаловать! Чем могу помочь?"
            : `👋 Приятно познакомиться, ${displayName}! Чем могу помочь?`,
          time: new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
        }]);
        switchRoom("main");
        // Сохраняем анонимную сессию в localStorage
        localStorage.setItem("uc_anon_session", JSON.stringify(guestSession));
      }

      // Отправка сообщения от анонима
      async function handleAnonSend() {
        if (!inputText.trim()) return;
        const text = inputText.trim();
        setInputText("");
        addUserMessage(text);
        // Сохраняем на сервере (пока заглушка — backend сделаем позже)
        try {
          await fetch(`${API_URL}/api/chat/anonymous-send`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              platform_user_id: USER_ID,
              user_name: user?.name || "Гость",
              text: text,
            }),
          });
        } catch (e) {}
      }

      // ⏱ Опрос новых сообщений для анонимного чата
      useEffect(() => {
        if (step !== "anon_chat") return;
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`${API_URL}/api/chat/anonymous-get?platform_user_id=${USER_ID}`);
            const data = await res.json();
            if (!data.messages) return;
            // Фильтруем только админские сообщения
            const adminMsgs = data.messages.filter(m => m.sender_type === "admin");
            if (adminMsgs.length === 0) return;
            // Добавляем каждое новое админское сообщение в чат
            const lastMsgId = sessionStorage.getItem("uc_last_admin_id") || "0";
            const newMsgs = adminMsgs.filter(m => parseInt(m.id) > parseInt(lastMsgId));
            newMsgs.forEach(m => {
              addBotMessage(m.text);
            });
            if (newMsgs.length > 0) {
              sessionStorage.setItem("uc_last_admin_id", adminMsgs[adminMsgs.length - 1].id);
            }
          } catch (e) {}
        }, 4000);
        return () => clearInterval(interval);
      }, [step]);

                          <div className="flex gap-1">
                            {Object.entries(priceGroups).map(([key, group]) => (
                              <button key={key} onClick={() => setPriceTab(key)}
                                className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors ${
                                  priceTab === key
                                    ? "bg-yellow-600 text-white"
                                    : "bg-yellow-50 border border-yellow-200 text-yellow-700 hover:bg-yellow-100"
                                }`}>
                                {group.title}
                              </button>
                            ))}
                          </div>
                          {priceLoading ? (
                            <div className="text-xs text-gray-400 py-4 text-center">Загрузка...</div>
                          ) : Object.keys(priceData).length === 0 ? (
                            <div className="text-xs text-gray-400 py-4 text-center">Нет данных о ценах</div>
                          ) : (
                            <div className="bg-white border border-gray-200 rounded-lg p-3 space-y-2">
                              <div className="text-xs font-bold text-gray-500">{currentGroup.title}</div>
                              {currentGroup.items.map(p => {
                                const data = priceData[p.key];
                                if (!data) return null;
                                const editVal = priceEdits[p.key];
                                const currentBase = editVal !== undefined ? editVal.base_price : data.base_price;
                                const currentSurcharge = editVal !== undefined ? editVal.surcharge_pct : data.surcharge_pct;
                                return (
                                  <div key={p.key}>
                                    <div className="flex items-center gap-2">
                                      <span className="text-xs text-gray-600 flex-1">{p.label}</span>
                                      <input type="number" value={currentBase} min="0" step="10"
                                        onChange={e => {
                                          const v = parseFloat(e.target.value) || 0;
                                          setPriceSaveStatus(null);
                                          setPriceEdits(prev => ({...prev, [p.key]: {...(prev[p.key]||data), base_price: v}}));
                                        }}
                                        className="w-16 border border-gray-300 rounded px-1.5 py-0.5 text-xs text-right" />
                                      <span className="text-xs text-gray-400 w-10">{p.unit}</span>
                                    </div>
                                    {data.surcharge_pct > 0 && (
                                      <div className="flex items-center gap-2 mt-1 ml-2">
                                        <span className="text-xs text-gray-400 underline decoration-dotted cursor-help"
                                          title="Умножает базовую цену когда юзер выбирает доп. опции: 🏠главная страница, 📌нерелевантная тематика, ✨особые пожелания. Каждая опция даёт +30% к базе. На объявления не действует (у них нет опций).">ℹ️ наценка</span>
                                        <input type="number" value={Math.round(currentSurcharge * 100)} min="0" max="100" step="5"
                                          onChange={e => {
                                            const v = (parseFloat(e.target.value) || 0) / 100;
                                            setPriceSaveStatus(null);
                                            setPriceEdits(prev => ({...prev, [p.key]: {...(prev[p.key]||data), surcharge_pct: v}}));
                                          }}
                                          className="w-10 border border-gray-300 rounded px-1 py-0.5 text-xs text-right" />
                                        <span className="text-xs text-gray-400">%</span>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>

                            <div className="flex items-center gap-2 bg-green-50 border border-green-300 rounded-lg px-3 py-2 fade-in">

                            </div>
